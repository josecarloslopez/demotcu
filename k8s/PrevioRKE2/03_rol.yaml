apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer-role
  namespace: app-ocr
rules:
  - apiGroups: ["", "apps", "networking.k8s.io"]
    resources: ["deployments", "services", "configmaps", "secrets", "persistentvolumeclaims", "ingresses", "pods"]
    verbs: ["*"]
